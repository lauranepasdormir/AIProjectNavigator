services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_DB: mydb
      # Trust all connections for local dev (no password needed)
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ./:/app
      - /app/node_modules    # keep container’s node_modules
    platform: linux/amd64
    ports:
      - "5001:5001"
    env_file:
      - .env                                # load secrets & keys from .env :contentReference[oaicite:1]{index=1}
    environment:
      NODE_ENV: development
      PORT: 5001
      DATABASE_URL: postgresql://neondb_owner:npg_uZS1ePJrxk2A@ep-empty-mud-a6vd2iig.us-west-2.aws.neon.tech/neondb?sslmode=require

      OPENAI_API_KEY: ${OPENAI_API_KEY}    # must match your OpenAI key :contentReference[oaicite:2]{index=2}

volumes:
  db-data:
